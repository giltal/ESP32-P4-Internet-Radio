## IDF Component Manager manifest
dependencies:
  idf: ">=5.5"

  # Display, touch, UI
  espressif/esp_lcd_jd9165: "^2.0.2"
  espressif/esp_lcd_touch_gt911: "^1.1.3"
  # 2.9+ needs the on_frame_buf_complete DPI callback from IDF > 5.5.2
  espressif/esp_lvgl_port: "~2.8.0"
  lvgl/lvgl: "~9.4.0"

  # Audio: ES8311 codec driver + MP3/AAC decoders
  espressif/esp_codec_dev: "^1.4.0"
  # 2.5.x runs on every ESP32-P4 revision; 2.6+ refuses to build for chips older than v3.0
  espressif/esp_audio_codec: "~2.5.0"

  # Wi-Fi through the on-board ESP32-C6 (SDIO).
  # esp_hosted is kept on the 2.x line, which works with the C6 firmware
  # Guition ships on this board (same pairing ESPHome uses).
  espressif/esp_wifi_remote: "1.6.5"
  espressif/esp_hosted: "2.12.13"
